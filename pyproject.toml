[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "td-mcp"
version = "0.0.2"
description = "TouchDesigner MCP server — live bridge, typed KB, POP support, vibe loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sasha Labai" }]
dependencies = [
    "mcp>=1.2.0",
    "websockets>=13.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
kb = [
    "lancedb>=0.13",
    "sentence-transformers>=3.0",
    "pyarrow>=17.0",
]
ingest = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.47",
    "yt-dlp>=2024.10.0",
    "openai-whisper>=20240930",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
td-mcp = "td_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["td_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

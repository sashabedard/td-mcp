[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "td-mcp"
version = "0.0.2"
description = "TouchDesigner MCP server — live bridge, typed KB, POP support, vibe loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sasha Labai" }]
dependencies = [
    # <2: mcp 2.0 dropped mcp.server.fastmcp, which server.py imports.
    # Lift the cap only together with a port to the 2.x API.
    "mcp>=1.2.0,<2",
    "websockets>=13.0",
    "pydantic>=2.7",
    # Visual loop: snapshot downscale + td_visual_diff metrics
    "Pillow>=10.0",
]

[project.optional-dependencies]
kb = [
    # vector.py uses list_tables() — absent from the 0.13-era API
    "lancedb>=0.24",
    "sentence-transformers>=3.0",
    "pyarrow>=17.0",
]
ingest = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.47",
    "yt-dlp>=2024.10.0",
    "openai-whisper>=20240930",
]
vj = [
    "open-clip-torch>=2.24",
    "torch>=2.2",
    "Pillow>=10.0",
    "anthropic>=0.34",
]
# Tutorial vision pass — anthropic only, no torch (CLIP not needed here)
vision = [
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # The test suite exercises the LanceDB layer and ingest modules with
    # real tables and mocked network — no torch/whisper needed.
    "lancedb>=0.24",
    "pyarrow>=17.0",
    "httpx>=0.27",
]

[project.scripts]
td-mcp = "td_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["td_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the TD-side bridge script as package data so _sync_bridge_script
# can repair the DAT from a pip-installed server (no source checkout).
"td_bridge_tox/webserver_callbacks.py" = "td_mcp/_bridge/webserver_callbacks.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's *default* rule set widened in 0.16 and broke CI on a
# docs-only commit. Selecting the rules by name makes lint a property of this
# repo, not of whichever ruff pip happened to resolve.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Runs inside TouchDesigner: op/me/td/project/root/absTime/app/webserverDAT...
# are injected by TD at runtime — undefined for ruff, real in the DAT.
"td_bridge_tox/webserver_callbacks.py" = ["F821"]
# Tests are organized in sections with their imports; late imports are
# deliberate there.
"tests/**" = ["E402"]
